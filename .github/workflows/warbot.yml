name: War Bot tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m compileall -q .
      - run: python -m pytest -q test_lore_campaign.py test_engine.py test_cinematic.py test_city_catalog.py
        env:
          NUMBA_NUM_THREADS: '2'
