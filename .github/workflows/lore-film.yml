name: Aurelia 4K 10FPS map-only MP4
on:
  push:
    paths: ['.github/workflows/lore-film.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Render real UHD 3840x2160 10 FPS map-only film
        env:
          NUMBA_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python -u map_only_4k.py aurelia_yogurtstan_4k_10fps_map.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 aurelia_yogurtstan_4k_10fps_map.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: aurelia-yogurtstan-4k-10fps-map-only
          path: |
            aurelia_yogurtstan_4k_10fps_map.mp4
            aurelia_yogurtstan_4k_10fps_map.mp4.json
          compression-level: 0
          retention-days: 30
